<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dice Playground</title>
    <!-- Tutorial/reference HTML: built into static-site/ by pre_build hook, copied into dist/ -->
    <link data-trunk rel="copy-dir" href="static-site/tutorial" data-target-path="tutorial" />
    <link data-trunk rel="copy-dir" href="static-site/cookbook" data-target-path="cookbook" />
    <link data-trunk rel="copy-dir" href="static-site/docs" data-target-path="docs" />
    <link data-trunk rel="copy-dir" href="static-site/references" data-target-path="references" />
    <link data-trunk rel="copy-file" href="static-site/llms.txt" />
    <link data-trunk rel="copy-file" href="staticwebapp.config.json" />
    <link data-trunk rel="rust" data-bin="dice-playground" data-wasm-opt="0" />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; }
        /* Chartistry defaults to dark SVG text; match slate output panel. */
        .dice-chartistry ._chartistry text {
            fill: rgb(203 213 225);
        }
        /* Woven literate report (engine-sanitized HTML). */
        .literate-report-body h1 { font-size: 1.5rem; font-weight: 700; margin: 1rem 0 0.5rem; }
        .literate-report-body h2 { font-size: 1.25rem; font-weight: 600; margin: 1rem 0 0.5rem; }
        .literate-report-body h3 { font-size: 1.125rem; font-weight: 600; margin: 0.75rem 0 0.35rem; }
        .literate-report-body p { margin: 0.5rem 0; }
        .literate-report-body ul, .literate-report-body ol { margin: 0.5rem 0 0.5rem 1.25rem; }
        .literate-report-body pre {
            background: rgb(15 23 42);
            border: 1px solid rgb(51 65 85);
            border-radius: 0.375rem;
            padding: 0.75rem;
            overflow-x: auto;
            font-family: ui-monospace, monospace;
            font-size: 0.875rem;
            margin: 0.75rem 0;
        }
        .literate-report-body code { font-family: ui-monospace, monospace; font-size: 0.875em; }
        .literate-report-body a { color: rgb(94 234 212); text-decoration: underline; }
        .literate-report-body table {
            border-collapse: collapse;
            width: 100%;
            margin: 0.75rem 0;
            font-size: 0.875rem;
        }
        .literate-report-body th,
        .literate-report-body td {
            border: 1px solid rgb(51 65 85);
            padding: 0.35rem 0.5rem;
            text-align: left;
        }
        .literate-report-body th {
            background: rgb(15 23 42);
        }
        .literate-report-body .dice-output { margin: 1rem 0; }
        .literate-report-body .dice-output-chart:not(:empty) { margin-bottom: 0.75rem; }
        .literate-report-body .dice-output-chart:empty { display: none; }
    </style>
</head>
<body></body>
</html>
